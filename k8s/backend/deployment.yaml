apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smart-inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: smart-inventory-backend:latest
          imagePullPolicy: Never
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: smart-inventory-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-inventory-secrets
                  key: SECRET_KEY